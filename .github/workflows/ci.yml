name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # gobi is pure Go: keep it building with cgo off, including on
      # 32-bit ARM and in wasm. (On wasm, gpkgio is excluded: its SQLite
      # driver has no wasm port.)
      - name: Build without cgo (linux/arm, wasm)
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm go build ./...
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go build . ./geometry/... ./h3/...
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build . ./geometry/... ./h3/...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
